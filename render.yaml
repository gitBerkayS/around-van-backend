services:
  - type: web
    name: around-van-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: TICKETMASTER_SECRET_KEY
        sync: false
      - key: METEOSOURCE_API_KEY
        sync: false
      - key: NOMINATIM_EMAIL
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
