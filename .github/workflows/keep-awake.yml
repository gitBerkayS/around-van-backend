name: Keep Render awake

on:
  schedule:
    # Every 10 minutes — free Render web services sleep after ~15 min idle
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Set repository variable APP_URL to your Render service URL (e.g. https://around-van-backend.onrender.com)"
            exit 1
          fi
          curl -fsS --max-time 60 "${APP_URL%/}/actuator/health"
          echo
          echo "ok"
