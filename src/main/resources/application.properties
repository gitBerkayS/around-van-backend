spring.application.name=backend

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

spring.flyway.enabled=true

ticketmaster.api-key=${TICKETMASTER_API_KEY:}
ticketmaster.secret-key=${TICKETMASTER_SECRET_KEY:}
ticketmaster.base-url=https://app.ticketmaster.com/discovery/v2

bcws.wildfire.base-url=https://delivery.maps.gov.bc.ca/arcgis/rest/services/mpcm/bcgwpub/MapServer/502
bcws.wildfire.page-size=1000

bcws.fire-weather.base-url=https://bcwsapi.nrs.gov.bc.ca/wfwx-datamart-api/v1
bcws.fire-weather.default-radius-km=25
bcws.fire-weather.max-radius-km=100
bcws.fire-weather.lookback-days=3
bcws.fire-weather.page-row-count=50
bcws.fire-weather.cache-minutes=60

environment-canada.aqhi.base-url=https://api.weather.gc.ca
environment-canada.aqhi.bounding-box=-123.6,48.9,-122.2,49.6
environment-canada.aqhi.limit=100

meteosource.api-key=${METEOSOURCE_API_KEY:}
meteosource.base-url=https://www.meteosource.com/api/v1/free
meteosource.units=metric
meteosource.language=en
meteosource.cache-minutes=60

nominatim.base-url=https://nominatim.openstreetmap.org
nominatim.country-codes=ca
nominatim.user-agent=around-van-backend/1.0
nominatim.email=${NOMINATIM_EMAIL:}

vancouver.opendata.base-url=https://opendata.vancouver.ca/api/explore/v2.1
vancouver.opendata.dataset=3-1-1-service-requests
vancouver.opendata.page-size=100

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5147,https://vancouverhub.netlify.app}

app.usage.activity-log-interval=${APP_USAGE_ACTIVITY_LOG_INTERVAL:5m}

resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Around Van <onboarding@berkaysefayi.ca>}
